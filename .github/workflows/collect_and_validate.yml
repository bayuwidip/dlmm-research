name: Collect and Validate

# CATATAN ARSITEKTUR (baca sebelum mengubah schedule):
# - Spesifikasi awal meminta schedule 15 menit. Itu TIDAK direkomendasikan:
#   1) cron GitHub Actions tidak andal di interval pendek (sering tertunda/dilewati).
#   2) tiap run mengunggah artifact -> menumpuk ratusan artifact/bulan untuk data
#      yang di fase TOOL TEST belum tentu berguna.
#   3) blueprint proyek sendiri menyatakan "Actions hanya untuk validasi, bukan
#      runtime utama". Scheduler 15 menit yang sesungguhnya seharusnya di VPS.
# - Maka di sini: manual (workflow_dispatch) + schedule HARIAN sekali.
#   Untuk uji fase ini kamu butuh konfirmasi pipeline jalan, bukan menabung data.
#   Jika tetap mau lebih sering, ubah cron di bawah (mis. '*/30 * * * *') dengan
#   sadar akan tiga konsekuensi di atas.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"   # sekali sehari, 01:00 UTC

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tidak ada dependency eksternal — skrip pakai stdlib saja.
      # Langkah install disiapkan jika kelak ada requirements.txt.
      - name: Install dependencies (jika ada)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch pools from Meteora live API
        run: python scripts/fetch_meteora_pools.py

      - name: Build watchlist + report
        run: python scripts/build_watchlist.py

      - name: OHLCV tool-test for Top 20 pairs (optional)
        # Skrip menangani kegagalan per-pool sendiri (API_ERROR/MALFORMED ditandai
        # per baris). continue-on-error agar masalah jaringan transien tidak
        # menggagalkan seluruh workflow. Skrip TETAP exit non-zero jika
        # pair_watchlist.csv hilang / tanpa kandidat / output tak bisa ditulis.
        continue-on-error: true
        run: python scripts/fetch_ohlcv_top_pairs.py

      # Strategy Classification v0.2: transformasi CSV murni (stdlib, tanpa
      # jaringan). Jika OHLCV API_ERROR, skrip menghasilkan NOT_EVALUATED dan
      # tetap exit 0 — jadi langkah ini tidak digerbangi pada hasil OHLCV.
      # TIDAK pakai continue-on-error: kegagalan di sini = bug nyata (mis.
      # pair_watchlist.csv hilang), bukan masalah jaringan transien.
      - name: Strategy Classification v0.2
        run: python scripts/classify_strategy.py

      # Paper Observation Readiness v0.1: transformasi CSV murni (stdlib, tanpa
      # jaringan). Membaca data/strategy_classification_v2.csv dan menulis
      # data/observations/ + reports/observations/. Observe-only / PAPER_ONLY —
      # tidak ada eksekusi, tidak ada LIVE_ELIGIBLE_*. TIDAK pakai
      # continue-on-error: kegagalan di sini = bug nyata, bukan jaringan transien.
      - name: Paper Observation Readiness v0.1
        run: python scripts/observe_strategy.py

      # Unit tests untuk transformasi klasifikasi + observasi. Murni stdlib,
      # tanpa jaringan; menggerbangi logika sebelum validasi gate.
      - name: Unit tests (classification + observation)
        run: |
          python -m unittest tests/test_classify_strategy.py
          python -m unittest tests/test_observe_strategy.py

      - name: Validate watchlist
        run: python scripts/validate_watchlist.py

      - name: Upload artifacts
        if: always()   # unggah meski langkah sebelumnya gagal, untuk diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: dlmm-run-${{ github.run_id }}
          path: |
            data/raw/*.json
            data/pools_watchlist.csv
            data/pair_watchlist.csv
            data/ohlcv_top_pairs.csv
            data/strategy_classification_v2.csv
            data/observations/
            reports/latest_pool_report.md
            reports/ohlcv_report.md
            reports/strategy_classification_v2.md
            reports/observations/
            logs/*.log
          if-no-files-found: warn
          retention-days: 14
